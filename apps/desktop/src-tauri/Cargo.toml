[package]
name = "drift"
# Crate version only — the app version lives in package.json, which tauri.conf.json reads.
version = "0.0.0"
description = "Drift — live wallpapers"
edition = "2021"
rust-version = "1.77"

[lib]
name = "drift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the window is borderless and transparent so the app can round its own
# corners and float its own traffic lights, as the design does.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"

# Desktop-level wallpaper windows on macOS. Same versions Tauri itself links.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder", "NSGraphics"] }

# Wallpaper engine on Windows: the window goes behind the desktop icons (`WorkerW`), plus the
# power, fullscreen and CPU checks and the lock-screen image. Same version Tauri links.
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Foundation",
  "Storage",
  "Storage_Streams",
  "System_UserProfile",
]

# Wallpaper engine on Linux: GTK for the desktop window (same version Tauri links), Xlib loaded
# at runtime for the fullscreen check, and gtk-layer-shell loaded at runtime on Wayland, so
# neither is a build dependency.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11-dl = "2.21"
libloading = "0.7"

# The session token lives in the OS credential store (src/secrets.rs). keyring 3: version 4 is a
# different, split-crate API. Linux uses the pure-Rust Secret Service client, so the build needs
# no libdbus.
[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
features = ["apple-native"]

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
features = ["async-secret-service", "tokio", "crypto-rust"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
