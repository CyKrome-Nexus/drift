name: CI

# Every hop of feature -> dev -> qa -> main is a pull request, so gating on
# pull_request covers the whole path. Direct pushes to the long-lived branches are
# blocked by .githooks/pre-push, and a tag release re-checks nothing — by then the
# code has already been through here three times.
on:
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    # Matches the Linux leg of the release build, so the system dependencies below
    # are the same known-good set.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # `cargo test` compiles the tauri crate, which links against webkit.
      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # Tests for packages and both apps, typecheck, the desktop frontend build, the
      # release-script selfcheck and cargo test. One script, so CI and `pnpm verify`
      # on a laptop cannot drift apart.
      - run: pnpm verify

      # The release job substitutes a real repository into the endpoint placeholder.
      # If someone commits an already-substituted config, or drops the public key,
      # release.yml would only find out at tag time — check it on every PR instead.
      - name: Updater config is still releasable
        env:
          PUBLIC_RELEASE_REPO: owner/ci-placeholder
        run: node .github/scripts/set-updater-endpoint.mjs

  desktop:
    name: Desktop build (${{ matrix.os }})
    # The wallpaper engine is platform code (AppKit on macOS, more to come), so each
    # OS has to compile here rather than first fail at tag time. Linux is covered by
    # `cargo test` in Verify.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # No bundles, so no signing key: installers and signatures are release.yml's job.
      - run: pnpm --filter @drift/desktop tauri build --no-bundle --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'

  mobile:
    name: Phone bundles (iOS and Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Metro bundles the JS for both platforms; native builds need EAS or a dev build.
      - run: npx expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/expo-export"
        working-directory: apps/mobile
