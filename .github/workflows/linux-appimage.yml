name: Linux AppImage (test build)

# Manual only. Builds nothing but the AppImage, signs nothing, publishes nothing —
# it exists so a Linux bundle can be tested from a branch without cutting a tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    # Matches the release matrix; the glibc/webkit versions here are what the
    # published AppImage carries, so a test build has to use the same image.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # No signing key here, so updater artifacts are turned off rather than
      # failing the bundler.
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
